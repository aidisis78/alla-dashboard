    const enc=new TextEncoder();
    const keyBytes=await crypto.subtle.digest('SHA-256',enc.encode(k));
    const key=await crypto.subtle.importKey('raw',keyBytes,{name:'AES-GCM'},false,['decrypt']);
    const raw=Uint8Array.from(atob(PAYLOAD),c=>c.charCodeAt(0));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
    const html=new TextDecoder().decode(pt);
    document.title='AIG OS';
    document.body.innerHTML='';
    document.body.style.cssText='margin:0;padding:0;overflow:hidden';
    const fr=document.createElement('iframe');
    fr.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;border:none;display:block;background:#0d1120';
    fr.setAttribute('srcdoc',html);
    document.body.appendChild(fr);
  }catch(e){document.getElementById('msg').innerHTML='<div style="font-size:40px">🔒</div><h2>Locked</h2><p>The key on this device did not match. Open your private bookmark link again.</p>';}
}
unlock();
